<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="lockBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Cyber Hex Shield -->
  <path d="M32 4 L56 14 V29 C56 44.5 45.8 55.4 32 60 C18.2 55.4 8 44.5 8 29 V14 Z"
        fill="#0b0f19"
        stroke="url(#shieldGrad)"
        stroke-width="2.5"
        stroke-linejoin="round"
        filter="url(#cyberGlow)" />

  <!-- Inner Cyber Circuit Lines -->
  <path d="M16 26 L24 26 L28 30" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <circle cx="16" cy="26" r="1.5" fill="#00f0ff" opacity="0.8" />
  
  <path d="M48 26 L40 26 L36 30" stroke="#8b5cf6" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <circle cx="48" cy="26" r="1.5" fill="#8b5cf6" opacity="0.8" />

  <path d="M32 54 L32 49" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Shackle -->
  <path d="M25 29 V22 C25 18.1 28.1 15 32 15 C35.9 15 39 18.1 39 22 V29"
        stroke="url(#shieldGrad)"
        stroke-width="3"
        stroke-linecap="round" />

  <!-- Lock Body -->
  <rect x="22" y="28" width="20" height="17" rx="3.5"
        fill="url(#lockBody)"
        stroke="#00f0ff"
        stroke-width="1.5" />

  <!-- Keyhole & Core Indicator -->
  <circle cx="32" cy="35" r="2.5" fill="#00f0ff" />
  <path d="M31 35 L33 35 L34 40 L30 40 Z" fill="#00f0ff" />
</svg>
